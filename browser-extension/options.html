<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>浏览器首页一键收藏设置</title><style>body{font:14px system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 20px}label{display:block;margin:18px 0 6px}input{width:100%;box-sizing:border-box;padding:9px}button{margin-top:20px;padding:9px 16px}#status{margin-top:16px;color:#236b3a}</style></head>
<body>
  <h1>浏览器首页一键收藏</h1>
  <p>令牌位于项目的 <code>homepage-secrets/capture_token.txt</code>，只保存在本扩展的本地存储中。</p>
  <label for="homepageUrl">首页地址</label>
  <input id="homepageUrl" type="url" autocomplete="off">
  <label for="captureToken">收藏令牌</label>
  <input id="captureToken" type="password" autocomplete="off">
  <label for="defaultCollectionId">默认收藏分类</label>
  <select id="defaultCollectionId" disabled><option value="">打开扩展后选择分类</option></select>
  <button id="save">保存</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
